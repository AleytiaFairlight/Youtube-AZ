name: Build YouTube AZ

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      patches_version:
        description: "Build only this Morphe patches version (e.g. 1.41.0). Leave empty to build every new release."
        required: false
        default: ""
      dry_run:
        description: "Build only: upload the APKs as a workflow artifact instead of publishing releases"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-youtube-az
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set (see .github/morphe/README.md)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morphe.keystore"

      - name: Patch and release
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHES_VERSION: ${{ inputs.patches_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          MORPHE_KEYSTORE: ${{ runner.temp }}/morphe.keystore
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MORPHE_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          MORPHE_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: python3 .github/morphe/build.py --work-dir "$RUNNER_TEMP/morphe"

      - name: Upload APKs (dry run)
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-az-apks
          path: ${{ runner.temp }}/morphe/out/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
